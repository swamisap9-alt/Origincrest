# OriginCrest agent settings. Copy to config.yaml and edit.
# Anything you leave out uses the built-in default (see origincrest_agent/config.py).
# Windows paths: keep them in single quotes so the backslashes stay as they are.

timezone: Australia/Adelaide

# State database, logs, workbook backups, run reports and draft previews.
# Kept on the local disk (not OneDrive) on purpose.
data_dir: '%LOCALAPPDATA%\OriginCrestAgent'

workbooks:
  rfq:
    path: 'C:\Users\swami\OneDrive\Documents\Origincrest\Origincrest 3PL and Freight forwarder contacts RFQ\OriginCrest_Freight_3PL_Contacts_RFQ.xlsx'
    default_kind: freight      # rows here are RFQ / logistics contacts (5-day follow-ups)
  master:
    path: 'C:\Users\swami\OneDrive\Documents\Origincrest\OriginCrest enquiries\Australian_Coffee_3PL_Master_Contacts_Oct2026.xlsx'
    default_kind: buyer        # rows here are coffee businesses unless their Category says logistics

  suppliers:                   # Indonesian suppliers; created by the first `suppliers` run
    path: 'C:\Users\swami\OneDrive\Documents\Origincrest\OriginCrest suppliers\Indonesian_Coffee_Suppliers.xlsx'
    default_kind: supplier

tabs:
  ignore_tabs: []              # tabs the agent must never touch, e.g. ["Pricing"]

claude:
  model: claude-opus-5-5

# Workflow 1 (weekly). Each workbook gets its own kind of lead, split into two tabs:
# Adelaide / South Australia, and all other states together.
discovery:
  profiles:
    rfq:                        # freight forwarders, customs brokers and 3PLs -> RFQ emails
      adelaide_tab: New Freight-3PL - Adelaide
      other_tab: New Freight-3PL - Other States
      categories: ['Freight forwarders, customs brokers & 3PLs']
    master:                     # categories read from your own tabs -> intro emails (RFQs for logistics ones)
      adelaide_tab: New Leads - Adelaide
      other_tab: New Leads - Other States
      category_tabs:
        - tab: New Prospects Oct-26            # every category in its Category column
        - tab: All contacts                    # only the categories containing these words
          match: [importer, roaster, wholesal, trader]
          fallback: 'Importers, Roasters, Wholesalers & Traders'
      exclude_categories: []    # e.g. ['Cafe groups']
  categories_per_run: 4         # with more categories than this, each week takes the next few
  max_new_rows_per_workbook: 20
  max_new_rows_per_segment: 6   # per category per region
  run_leads_after: true         # go straight on to workflow 2 for the new rows

# Supplier search (every 3 days): Indonesian exporters, cooperatives and mills, each compared with your
# current vendor, then a sourcing-enquiry draft for each. Follow-ups after followup.supplier_days.
suppliers:
  tab: New Suppliers - Indonesia
  # The repository is public: put your vendor, customer and prices in config.yaml only.
  baseline_vendor:
    name: ''                    # your current vendor
    # What you know about them: origins and grades, FOB prices quoted, minimum order, payment terms,
    # certifications, how responsive they are. New suppliers are compared against this.
    profile: ''
  max_new_rows_per_run: 8
  max_drafts_per_run: 8
  min_fit_score_for_draft: 50
  extra_focus: []               # more regions / supplier types to search, e.g. ['Kintamani natural-process lots']
  priority_focus: []            # searched first, one per run, e.g. ['Dampit robusta G1 natural exporters, Surabaya']

# What the supplier enquiries say about OriginCrest as a buyer. `demand` is used word for word; if it's
# blank, drafts carry [placeholders] for the customer and the LCL / FCL quantities.
sourcing:
  intro: ''                     # e.g. 'OriginCrest is an Adelaide-based importer of Indonesian single-origin green coffee.'
  demand: ''                    # e.g. '<customer>: LCL trial of ... kg of ..., then 1 x 20ft FCL (about ... t) every ...'
  logistics: 'Sea freight, customs and biosecurity clearance and warehousing in Australia are already arranged.'
  wanted: [Sumatra, Sulawesi, Java, Flores]

# Workflow 2: drafts for the rows in the new-lead tabs.
leads:
  extra_tabs: []                # other tabs whose rows should also get drafts
  max_research_per_run: 10
  max_drafts_per_run: 8
  min_fit_score_for_draft: 55
  draft_for_unreviewed: true    # false = only draft after you change "New - to review" to "Reviewed"/"Approved"

# What RFQ emails ask forwarders / 3PLs to quote. Optional: left blank, the agent uses the rows in
# your RFQ workbook and the last RFQ you sent, and writes [placeholders] for anything it can't find.
rfq:
  requirements: ''              # e.g. '1-2 x 20ft FCL per quarter, green coffee in jute bags, FOB Belawan -> Port Adelaide; customs + DAFF clearance; delivery to our warehouse'

# Workflow 3 (weekdays): all tabs of these workbooks, plus every workbook's new-lead tabs.
followup:
  workbooks: [rfq]
  open_statuses: [Open, Sent, RFQ sent, Awaiting reply, Awaiting quote, Waiting, Pending, Followed up]
  blank_status_is_open: true   # rows with no status are open once "Date sent" is filled in
  # Notes that mean "phone them": the draft gets [CALL FIRST], the phone number and call points.
  call_phrases: [need to be called, needs to be called, to be called, need to call, needs a call, need a call,
                 call first, call them, call back, call instead, please call, call required, call needed,
                 phone first, phone them, ring them]
  # Notes that mean no more follow-ups (for rows with no status).
  done_phrases: [quote received, quoted, declined, not interested, closed, no follow up, no further follow up,
                 do not follow up, don't follow up]
  quote_days: 5
  lead_days: 10
  supplier_days: 3             # follow up unanswered supplier enquiries after 3 days
  max_drafts_per_run: 15
  max_followups_per_contact: 3

# Daily Google Drive backup (scripts\run.cmd drive-sync): copies new or changed files from the OneDrive
# Origincrest folder into Google Drive for desktop's folder on this PC; Google uploads them. Never deletes.
drive_sync:
  source: 'C:\Users\swami\OneDrive\Documents\Origincrest'
  destination: 'G:\My Drive\Business\Origincrest files synced from laptop'   # as shown in File Explorer

# Your mail server's IMAP settings - the same ones your phone or Outlook uses for this mailbox
# (your email host's "manual setup" page lists them). The password goes in .env.
email:
  imap_host: '<<EDIT ME: e.g. mail.origincrest.com.au>>'
  imap_port: 993
  security: ssl                # ssl for port 993; starttls for port 143
  username: '<<EDIT ME: mailbox login, usually the full email address>>'
  # Folders are found automatically (Drafts / Sent, INBOX.Drafts / INBOX.Sent, Sent Items...).
  # `check` lists the server's folders; set these only if it picks the wrong ones.
  drafts_folder: ''
  sent_folder: ''
  reply_folders: []            # default: INBOX. Add folders your mail rules move replies into.
  # auto   = use the signature you already use: copied from your recent sent emails, along with your
  #          name and From address (`check` shows exactly what it found)
  # config = build a signature from the sender details below
  # none   = no signature (add your own when you send)
  signature: auto

# Optional. With signature: auto, leave these blank: anything you fill in overrides what's learned.
sender:
  name: ''
  email: ''                    # From address; defaults to the one in your sent emails
  business_name: OriginCrest   # used in the unsubscribe line
  unsubscribe_email: ''        # defaults to the From address
  # only used with signature: config
  title: ''
  abn: ''
  address: ''
  phone: ''
  website: ''

# Optional background about OriginCrest that emails may mention. Leave it as is and the agent uses
# "OriginCrest supplies Indonesian single-origin green coffee - Sumatra, Sulawesi, Java and Flores -
# to Australian roasters". Add facts only if you want them used (the agent never invents prices,
# certifications or volumes).
offer:
  summary: ''
  facts: []                    # e.g. ["Green samples (200 g) posted free within Australia", "Stock held in Adelaide"]
